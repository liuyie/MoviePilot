name: Manual Update Python Dependencies
on:
  workflow_dispatch:
    inputs:
      aiohttp_version:
        description: aiohttp 版本，留空自动更新到最新
        required: false
        default: ""
      certifi_version:
        description: certifi 版本，留空自动更新到最新
        required: false
        default: ""
      pillow_version:
        description: pillow 版本，留空自动更新到最新
        required: false
        default: ""
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v3
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build uv add arguments
        id: build_args
        run: |
          args=()
          if [[ -n "${{ github.event.inputs.aiohttp_version }}" ]]; then
            args+=("aiohttp>=${{ github.event.inputs.aiohttp_version }}")
          else
            args+=("aiohttp")
          fi
          if [[ -n "${{ github.event.inputs.certifi_version }}" ]]; then
            args+=("certifi>=${{ github.event.inputs.certifi_version }}")
          else
            args+=("certifi")
          fi
          if [[ -n "${{ github.event.inputs.pillow_version }}" ]]; then
            args+=("pillow>=${{ github.event.inputs.pillow_version }}")
          else
            args+=("pillow")
          fi
          echo "DEPS=${args[*]}" >> $GITHUB_OUTPUT

      - name: Update dependencies & regenerate lock
        run: |
          uv add ${{ steps.build_args.outputs.DEPS }}
          uv lock --check

      - name: Show diff
        run: git diff

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if git diff --cached --quiet; then
            echo "✅ 没有依赖变更，无需提交"
          else
            git commit -m "chore(deps): bump aiohttp certifi pillow via manual workflow"
            git push origin v3
          fi
