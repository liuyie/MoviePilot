name: Manual Update Python Dependencies (aiohttp + certifi only)
on:
  workflow_dispatch:
    inputs:
      aiohttp_version:
        description: aiohttp 版本（建议填 3.14.4）
        required: false
        default: "3.14.4"
      certifi_version:
        description: certifi 版本（建议填 2026.10.19）
        required: false
        default: "2026.10.19"
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Install system deps for pillow-avif-plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y libavif-dev

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v3
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Update aiohttp & certifi only
        run: |
          uv add "aiohttp>=${{ github.event.inputs.aiohttp_version }}" "certifi>=${{ github.event.inputs.certifi_version }}"
          uv lock --check

      - name: Show diff
        run: git diff

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if git diff --cached --quiet; then
            echo "✅ 没有依赖变更，无需提交"
          else
            git commit -m "chore(deps): bump aiohttp=${{ github.event.inputs.aiohttp_version }} certifi=${{ github.event.inputs.certifi_version }}"
            git push origin v3
          fi
