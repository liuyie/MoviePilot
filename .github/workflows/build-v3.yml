name: MoviePilot Builder v3
on:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: builder-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit / runtime-standard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Export runtime-standard requirements
        run: |
          uv export --quiet --locked --no-default-groups --group runtime-standard \
            -o /tmp/moviepilot-audit-standard.txt

      - name: pip-audit runtime-standard (with pillow CVE exceptions)
        run: |
          uvx --from pip-audit pip-audit \
            --require-hashes --disable-pip --strict --progress-spinner off \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112899 \
            --requirement /tmp/moviepilot-audit-standard.txt

  # ========== 如果你不需要 free-threaded 审计，可以直接删掉下面这个 job ==========
  audit-free-threaded:
    name: Dependency Audit / free-threaded
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Export free-threaded requirements
        run: |
          uv export --quiet --locked --no-default-groups --group free-threaded \
            -o /tmp/moviepilot-audit-ft.txt

      - name: pip-audit free-threaded (with pillow CVE exceptions)
        run: |
          uvx --from pip-audit pip-audit \
            --require-hashes --disable-pip --strict --progress-spinner off \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112899 \
            --requirement /tmp/moviepilot-audit-ft.txt

  # ========== 镜像构建 Job，依赖 audit 通过后才执行 ==========
  build-and-push:
    name: Build & Push Image
    needs: [audit, audit-free-threaded]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/moviepilot:v3
          cache-from: type=gha
          cache-to: type=gha,mode=max
